<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="events.css">
    <title>JavaScript Events</title>
</head>
<body>
    <h1>JavaScript Events</h1>

    <div class="image-and-colors">
        <div class="load-image">
            <div class="image-container">
                <img src="C:\Users\S1iM\source\repos\Web\JavaScript"*/ alt="Фото студента" id="image">
            </div>
            <input type="file" id="image-file" onchange="SetImage()">
            <div id="debug"></div>
        </div>

        <div class="colors">
            <div>
                <lable for="background-color">Выберите цвет фона:</lable>
                <input type="color" id="background-color" oninput="setBackgroundColor()">
            </div>
            <div>
                <lable for="foreground-color">Выберите цвет текста:</lable>
                <input type="color" id="foreground-color" oninput="setForegroundColor(event)">
            </div>
        </div>
    </div>

    <script>
        function SetImage() {
            let filename = document.getElementById("image-file");
            //let reader = new FileReader();
            let file = filename.files[0];
            document.getElementById("debug").innerHTML = URL.createObjectURL(file); // filename.files[0].name;
            document.getElementById("image").src = URL.createObjectURL(file);


            // reader.onload = function (e) {
            //     document.getElementById("image").src = e.target.result;
            // }
            // reader.readAsDataURL(filename.files[0]);
        }
        function setBackgroundColor() {
            //DOM - Document Object Model (Объектная модель документа).
            //Document document = new.Document();
            document.body.style.backgroundColor = document.getElementById("background-color").value;
        }
        function setForegroundColor(e) {
           // document.getElementByClassName("load-image")[0].style.backgroundColor = e.target.value;
            document.body.style.color = e.target.value;
        }
    </script>
</body>
</html>
